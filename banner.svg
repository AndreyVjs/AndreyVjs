<svg width="1000" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBA142"/>
      <stop offset="100%" stop-color="#DE8C26"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="400" fill="url(#bg-grad)" />

  <!-- Subtle Grid/Lines -->
  <path d="M 0 100 L 1000 100 M 0 200 L 1000 200 M 0 300 L 1000 300" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
  <path d="M 250 0 L 250 400 M 500 0 L 500 400 M 750 0 L 750 400" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Concentric Circles -->
  <circle cx="500" cy="200" r="180" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2" />
  <circle cx="500" cy="200" r="170" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="8 8" />
  <circle cx="500" cy="200" r="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2" />

  <!-- Backdrop Massive Text -->
  <text x="500" y="280" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="240"
        fill="#FFFFFF" fill-opacity="0.18" text-anchor="middle" letter-spacing="10">ANDREY</text>

  <!-- Shadow for Box -->
  <rect x="435" y="115" width="160" height="200" rx="4" fill="#000000" fill-opacity="0.15" />

  <!-- Foreground Box -->
  <rect x="420" y="100" width="160" height="200" rx="4" fill="#D4891A" />
  <rect x="420" y="100" width="160" height="200" rx="4" fill="none" stroke="#FFFFFF" stroke-width="3" />

  <!-- Text inside Box -->
  <text x="500" y="190" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="90" fill="#FFFFFF" text-anchor="middle">A</text>
  <text x="500" y="230" font-family="Courier New, monospace" font-weight="bold" font-size="28" fill="#FFFFFF" text-anchor="middle">VJS</text>
  <text x="500" y="265" font-family="Courier New, monospace" font-weight="bold" font-size="14" fill="#FFFFFF" fill-opacity="0.8" text-anchor="middle">DEV . 2026</text>

  <!-- Top Left detail lines -->
  <rect x="40" y="40" width="40" height="4" fill="#FFFFFF" />
  <rect x="40" y="52" width="20" height="4" fill="#FFFFFF" />

  <!-- Top Right Number -->
  <text x="960" y="55" font-family="Courier New, monospace" font-weight="bold" font-size="30" fill="#FFFFFF" text-anchor="end">05</text>
  <rect x="955" y="65" width="4" height="30" fill="#FFFFFF" />

  <!-- Bottom Left Nav -->
  <text x="40" y="300" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" fill-opacity="0.45" letter-spacing="2">DASHBOARD</text>
  <text x="40" y="325" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" letter-spacing="2">PROJECTS</text>
  <text x="40" y="350" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" fill-opacity="0.45" letter-spacing="2">ABOUT</text>
  <text x="40" y="375" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" fill-opacity="0.45" letter-spacing="2">CONTACT</text>

  <!-- Bottom Right -->
  <text x="960" y="370" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="16" fill="#FFFFFF" text-anchor="end" letter-spacing="1">Scroll Down</text>
  <rect x="850" y="378" width="110" height="2" fill="#FFFFFF" />
</svg>
